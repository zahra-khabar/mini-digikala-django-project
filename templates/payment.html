{% extends 'base.html' %}
{% block title %}افزایش موجودی | دیجی‌کالا{% endblock %}

{% block content %}
<h2>💳 افزایش موجودی</h2>

<form action="{% url 'payment' %}" method="post" class="payment-form">
    {% csrf_token %}
    <label for="amount">مبلغ را وارد کنید:</label>
    <input type="number" name="amount" id="amount" min="1" required>
    <button type="submit" class="btn">افزودن موجودی</button>
</form>
{% endblock %}
