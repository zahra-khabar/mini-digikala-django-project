{% extends 'base.html' %}
{% block title %}ویرایش فروشگاه | دیجی‌کالا{% endblock %}
{% block content %}
<h2>✏️ ویرایش {{ store.name }}</h2>

<form method="post" class="auth-form">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn">ذخیرهٔ تغییرات</button>
    <a href="{% url 'store_detail' store.id %}" class="btn btn-secondary">انصراف</a>
</form>
{% endblock %}
