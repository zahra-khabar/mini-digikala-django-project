{% extends 'base.html' %}
{% block title %}Add Product | DijiKala{% endblock %}
{% block content %}
<h2>➕ Add Product to {{ store.name }}</h2>
<form method="post" enctype="multipart/form-data" class="auth-form">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn">Add Product</button>
</form>
{% endblock %}
