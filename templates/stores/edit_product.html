{% extends 'base.html' %}
{% block title %}ویرایش محصول | دیجی‌کالا{% endblock %}
{% block content %}
<h2>✏️ ویرایش {{ product.name }}</h2>

<form method="post" enctype="multipart/form-data" class="auth-form">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn">ذخیرهٔ تغییرات</button>
    <a href="{% url 'store_detail' store.id %}" class="btn btn-secondary">انصراف</a>
</form>
{% endblock %}
