{% extends 'base.html' %}
{% block title %}فروشگاه‌ها | دیجی‌کالا{% endblock %}
{% block content %}
<h2>🏪 همهٔ فروشگاه‌ها</h2>
<div class="card-grid">
    {% for store in stores %}
        <div class="card">
            <h3>{{ store.name }}</h3>
            <p>{{ store.description|truncatewords:15 }}</p>
            <a href="{% url 'store_detail' store.id %}" class="btn">مشاهدهٔ فروشگاه</a>
        </div>
    {% empty %}
        <p>هنوز فروشگاهی ثبت نشده است.</p>
    {% endfor %}
</div>
{% endblock %}
