{% extends 'base.html' %}

{% block title %}Order History | DijiKala{% endblock %}

{% block content %}
<h2>📜 Order History</h2>

<div class="card-grid">
    {% for order in orders %}
        <div class="card">
            <h3>Order #{{ order.id }}</h3>
            <p>Date: {{ order.created_at }}</p>
            <p>
                <strong>Total:</strong>
                ${{ order.total_amount }}
            </p>
        </div>
    {% empty %}
        <p>No orders yet.</p>
    {% endfor %}
</div>
{% endblock %}
